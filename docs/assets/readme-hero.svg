    <text x="700" y="180" font-size="19" fill="#65E6C0">02</text><text x="744" y="179" font-size="18" fill="#E6F0F6">Прогноз + факторы</text>
    <path d="M867 205V226m-5-6 5 6 5-6" fill="none" stroke="#65E6C0" stroke-width="2"/>
    <rect x="680" y="227" width="374" height="59" rx="12" fill="#17483F" stroke="#65E6C0"/>
    <text x="700" y="262" font-size="19" fill="#65E6C0">03</text><text x="744" y="261" font-size="18" fill="#E6F0F6">Решение менеджера</text>
